services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment: &backend_environment
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DEBUG: "True"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      DB_NAME: ${DB_NAME:-ecompho_db}
      DB_USER: ${DB_USER:-ecompho}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: "5432"
      REDIS_HOST: ${REDIS_HOST:-redis}
      MEDIA_ROOT: /app/media
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:?Set REPLICATE_API_TOKEN in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - dokploy-network

  worker:
    build: ./backend
    restart: unless-stopped
    environment: *backend_environment
    command: ["celery", "-A", "ecompho", "worker", "--loglevel=info", "--concurrency=2"]
    volumes:
      - media_data:/app/media
    depends_on:
      backend:
        condition: service_healthy

    networks:
      - dokploy-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - media_data:/srv/media:ro
      - static_data:/srv/static:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dokploy-network

volumes:
  media_data:
  static_data:

networks:
  dokploy-network:
    external: true
